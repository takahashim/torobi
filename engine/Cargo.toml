[package]
name = "torobi-engine"
version = "0.0.1"
edition = "2021"
description = "Torobi's execution engine: interprets GraphConfig on MLX"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# The config digest a checkpoint records, computed over the same bytes
# the Ruby side hashed.
sha2 = "0.10"

# MLX is reached through mlx-c, bound in this crate (src/mlxc/) from the
# headers and archives of the prefix build.rs is pointed at. No Rust crate
# stands between the engine and mlx-c; docs/vendoring.md ("mlx-c, bound
# here") says why.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
# dladdr, for finding this object and refusing a missing runtime artifact
# before MLX fails less clearly (src/runtime.rs): the metallib on Apple,
# which MLX aborts over, and NVIDIA's JIT headers on Linux, which MLX only
# fails the first kernel over.
libc = "0.2"

[build-dependencies]
# The bindings for mlx-c, generated from the headers in the prefix that is
# linked. docs/vendoring.md ("mlx-c, bound here") says why they are
# generated here.
bindgen = "0.72"

[dev-dependencies]
# Checkpoint tests write real directories; nothing here mocks a filesystem.
tempfile = "3"
