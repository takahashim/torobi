# The single source of truth for the IR's operation vocabulary.
#
# Each entry declares: how many value inputs the op takes (an integer, or
# [min, max]), how many parameters it references, its attributes and their
# types, the shape rule that infers its output, and where the DSL surfaces
# it ("handle" ops become methods on node handles; everything else is either
# an operator, a builder on `g`, or internal to a lowering).
#
# Semantic ops (sdpa, rope, layer_norm, rms_norm) are kept whole: a backend
# may run a fused kernel or decompose them, but the IR does not lower them.

- name: parameter
  inputs: 0
  params: 1
  attributes: {}
  shape_rule: parameter

- name: add
  inputs: 2
  shape_rule: broadcast
- name: sub
  inputs: 2
  shape_rule: broadcast
- name: mul
  inputs: 2
  shape_rule: broadcast
- name: div
  inputs: 2
  shape_rule: broadcast

- name: add_scalar
  inputs: 1
  attributes: { value: number }
  shape_rule: same_as_input
- name: sub_scalar
  inputs: 1
  attributes: { value: number }
  shape_rule: same_as_input
- name: mul_scalar
  inputs: 1
  attributes: { value: number }
  shape_rule: same_as_input
- name: div_scalar
  inputs: 1
  attributes: { value: number }
  shape_rule: same_as_input

- name: neg
  inputs: 1
  shape_rule: same_as_input
  handle: true
- name: abs
  inputs: 1
  shape_rule: same_as_input
  handle: true
- name: sqrt
  inputs: 1
  shape_rule: same_as_input
  handle: true
- name: square
  inputs: 1
  shape_rule: same_as_input
  handle: true
- name: exp
  inputs: 1
  shape_rule: same_as_input
  handle: true
- name: log
  inputs: 1
  shape_rule: same_as_input
  handle: true
# The exact form, 0.5x(1 + erf(x/sqrt2)), not the tanh approximation: the
# reference implementations of the models this has to match use erf, and a
# parity check against them is the point (docs/plan.md 9.2).
- name: gelu
  inputs: 1
  shape_rule: same_as_input
  handle: true
# The tanh approximation, which is a different function from the one
# above and not a faster spelling of it. Gemma is trained with it
# (`hidden_activation: gelu_pytorch_tanh`), so a graph that used the
# exact form would be a model that runs and is not the published one.
- name: gelu_tanh
  inputs: 1
  shape_rule: same_as_input
  handle: true
- name: relu
  inputs: 1
  shape_rule: same_as_input
  handle: true
- name: sigmoid
  inputs: 1
  shape_rule: same_as_input
  handle: true
- name: tanh
  inputs: 1
  shape_rule: same_as_input
  handle: true

# The only op that consumes randomness. Its key comes from the session's
# RNG state, never from a global: that is what makes a resumed run take the
# same masks a continuous one would (docs/plan.md section 11.1).
- name: dropout
  inputs: 1
  attributes: { p: number }
  shape_rule: same_as_input
  handle: true

# Semantic op, kept whole: the backend decides how to realize it, and the
# IR says what it means. Gradients do not flow through it.
- name: stop_gradient
  inputs: 1
  shape_rule: same_as_input
  handle: true

- name: softmax
  inputs: 1
  attributes: { axis: int }
  shape_rule: same_as_input
  handle: true
- name: rope
  inputs: 1
  attributes: { theta: number }
  shape_rule: same_as_input
  handle: true

- name: transpose
  inputs: 1
  attributes: { axes: int_list }
  shape_rule: transpose
  handle: true
# Multi-head attention is the reason this exists: [batch, seq, heads*head]
# has to become [batch, seq, heads, head] before the transpose that puts
# heads in front. One dimension may be -1, and it takes whatever is left,
# including a symbolic batch.
- name: reshape
  inputs: 1
  attributes: { shape: int_list }
  shape_rule: reshape
  handle: true
- name: slice
  inputs: 1
  attributes: { axis: int, start: int, length: int }
  shape_rule: slice
  handle: true
- name: mean
  inputs: 1
  attributes: { axes: int_list_or_null, keepdims: bool }
  shape_rule: reduce
- name: sum
  inputs: 1
  attributes: { axes: int_list_or_null, keepdims: bool }
  shape_rule: reduce
# The largest, which a stable log-softmax subtracts before it exponentiates:
# at the sizes a vocabulary has, exp of a raw logit overflows.
- name: max
  inputs: 1
  attributes: { axes: int_list_or_null, keepdims: bool }
  shape_rule: reduce

# The one op that changes a dtype rather than a shape.
#
# What it is for: a model held in bf16 is half the memory of the same
# model in f32, and the boundary reads a loss as f32 (docs/plan.md section
# 15.51). The cast is where those two meet, and it is written down rather
# than inserted, because a precision change nobody asked for is how a
# training run quietly stops matching its reference.
- name: cast
  inputs: 1
  attributes: { dtype: dtype }
  shape_rule: cast

- name: matmul
  inputs: 2
  shape_rule: matmul
- name: take
  inputs: 2
  shape_rule: take

- name: layer_norm
  inputs: [2, 3]
  attributes: { eps: number }
  shape_rule: same_as_input
- name: rms_norm
  inputs: 2
  attributes: { eps: number }
  shape_rule: same_as_input
# `causal` is the mask a decoder needs, and is an attribute rather than a
# batch field because it is a fact about the op and not about the data: a
# [1, 1, seq, seq] triangle handed over every step is megabytes of the same
# number, and the backend has the mode built in.
- name: sdpa
  inputs: [3, 4]
  attributes: { scale: number_or_null, causal: bool }
  shape_rule: sdpa

# Semantic op, kept whole for the reason 6.1 gives: what is dangerous about
# a cross entropy is its numerics (`log(sum(exp))` over a vocabulary
# overflows unless the largest is taken out first) and its backward, which
# should not build a second [rows, vocabulary] to get there. It answers one
# number per position and reduces nothing: which positions count, and how
# they are weighed, is the objective's to say.
- name: cross_entropy
  inputs: 2
  shape_rule: cross_entropy
